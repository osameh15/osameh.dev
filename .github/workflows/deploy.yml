name: Production pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: osameh-dev-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate for production
    uses: ./.github/workflows/quality.yml
    with:
      deploy_env: production
      artifact_name: osameh-production-dist

  deploy:
    name: Deploy tested bundle → osameh.dev
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://osameh.dev
    steps:
      - name: Download tested production bundle
        uses: actions/download-artifact@v4
        with:
          name: osameh-production-dist
          path: dist

      - name: Validate production bundle
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in index.html .htaccess build-info.json api/github.php \
                      api/contact.php api/health.php case-study.php \
                      case-studies-index.json sitemap.php; do
            if [[ ! -f "dist/$file" ]]; then
              echo "::error::Downloaded production artifact is missing dist/$file"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1
          jq . dist/build-info.json

      - name: Install deployment client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify production FTPS certificate fingerprint
        shell: bash
        env:
          PRODUCTION_FTP_HOST: ${{ secrets.FTP_HOST }}
          PRODUCTION_FTP_PORT: ${{ secrets.FTP_PORT }}
          PRODUCTION_FTP_CERT_FINGERPRINT: ${{ secrets.FTP_CERT_FINGERPRINT }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_FTP_HOST:?Missing FTP_HOST}"
          : "${PRODUCTION_FTP_CERT_FINGERPRINT:?Missing FTP_CERT_FINGERPRINT}"
          PRODUCTION_FTP_PORT="${PRODUCTION_FTP_PORT:-21}"
          cert_file="$(mktemp)"; trap 'rm -f "$cert_file"' EXIT
          timeout 25 openssl s_client -connect "${PRODUCTION_FTP_HOST}:${PRODUCTION_FTP_PORT}" -starttls ftp -showcerts </dev/null 2>/dev/null \
            | awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag{print} /-----END CERTIFICATE-----/{exit}' > "$cert_file"
          test -s "$cert_file" || { echo "::error::Could not read production FTPS certificate"; exit 1; }
          sha256="$(openssl x509 -in "$cert_file" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          sha1="$(openssl x509 -in "$cert_file" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$PRODUCTION_FTP_CERT_FINGERPRINT" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ${#expected} -eq 64 ]]; then actual="$sha256"; elif [[ ${#expected} -eq 40 ]]; then actual="$sha1"; else echo "::error::Invalid production fingerprint length"; exit 1; fi
          [[ "$expected" == "$actual" ]] || { echo "::error::Production FTPS fingerprint mismatch"; exit 1; }

      - name: Preflight production FTPS login
        shell: bash
        env:
          PRODUCTION_FTP_HOST: ${{ secrets.FTP_HOST }}
          PRODUCTION_FTP_PORT: ${{ secrets.FTP_PORT }}
          PRODUCTION_FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_FTP_HOST:?Missing FTP_HOST}"
          : "${PRODUCTION_FTP_USERNAME:?Missing FTP_USERNAME}"
          : "${LFTP_PASSWORD:?Missing FTP_PASSWORD}"
          PRODUCTION_FTP_PORT="${PRODUCTION_FTP_PORT:-21}"
          if ! lftp --norc --env-password --user "${PRODUCTION_FTP_USERNAME}" -p "${PRODUCTION_FTP_PORT}" "${PRODUCTION_FTP_HOST}" <<'LFTP'
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          cls -1 /
          bye
          LFTP
          then
            echo "::error::Production FTPS login failed. Verify only FTP_HOST, FTP_PORT, FTP_USERNAME and FTP_PASSWORD. Staging FTP secrets are never used by this job."
            exit 1
          fi

      - name: Deploy production with production-only credentials
        shell: bash
        env:
          PRODUCTION_FTP_HOST: ${{ secrets.FTP_HOST }}
          PRODUCTION_FTP_PORT: ${{ secrets.FTP_PORT }}
          PRODUCTION_FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          PRODUCTION_FTP_PORT="${PRODUCTION_FTP_PORT:-21}"
          lftp --norc --env-password --user "${PRODUCTION_FTP_USERNAME}" -p "${PRODUCTION_FTP_PORT}" "${PRODUCTION_FTP_HOST}" <<'LFTP'
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set net:reconnect-interval-base 5
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          mirror --reverse --delete --verbose --parallel=4 \
            --exclude-glob .well-known \
            --exclude-glob '.well-known/**' \
            --exclude-glob cgi-bin \
            --exclude-glob 'cgi-bin/**' \
            dist/ /
          bye
          LFTP

      - name: Verify live production build
        shell: bash
        run: |
          set -euo pipefail
          expected="$(jq -r '.buildId' dist/build-info.json)"
          matched=0
          for attempt in {1..10}; do
            live="$(curl -fsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://osameh.dev/build-info.json?ci=${GITHUB_SHA}-${attempt}" | jq -r '.buildId // empty' 2>/dev/null || true)"
            [[ "$live" == "$expected" ]] && { matched=1; break; }
            sleep 12
          done
          if [[ "$matched" -ne 1 ]]; then
            echo "::warning::Files uploaded successfully, but ParsPack CDN still reports an older build."
          fi
