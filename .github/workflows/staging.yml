name: Deploy staging.osameh.dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: osameh-dev-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging:
    name: Quality → staging build → FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Quality gates
        run: |
          npm run quality
          npm run typecheck
          find public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build staging bundle
        run: npm run build:staging
      - name: Verify staging bundle
        run: npm run verify:dist
      - name: Install Playwright smoke runner without changing lockfile
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium for staging smoke
        run: npx playwright install --with-deps chromium
      - name: Browser staging-bundle smoke
        run: npx playwright test
      - name: Install deployment client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Verify staging FTPS certificate fingerprint
        shell: bash
        env:
          FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          FTP_CERT_FINGERPRINT: ${{ secrets.STAGING_FTP_CERT_FINGERPRINT }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing STAGING_FTP_HOST}"
          FTP_PORT="${FTP_PORT:-21}"
          cert_file="$(mktemp)"; trap 'rm -f "$cert_file"' EXIT
          timeout 25 openssl s_client -connect "${FTP_HOST}:${FTP_PORT}" -starttls ftp -showcerts </dev/null 2>/dev/null \
            | awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag{print} /-----END CERTIFICATE-----/{exit}' > "$cert_file"
          test -s "$cert_file"
          sha256="$(openssl x509 -in "$cert_file" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          sha1="$(openssl x509 -in "$cert_file" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "${FTP_CERT_FINGERPRINT:-}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ ${#expected} -eq 64 ]] && actual="$sha256" || actual="$sha1"
          [[ -n "$expected" && "$expected" == "$actual" ]] || { echo '::error::Staging FTPS fingerprint mismatch'; exit 1; }
      - name: Deploy staging
        shell: bash
        env:
          FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"; : "${FTP_USERNAME:?}"; : "${FTP_PASSWORD:?}"; FTP_PORT="${FTP_PORT:-21}"
          lftp <<LFTP
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          open -p ${FTP_PORT} ${FTP_HOST}
          user ${FTP_USERNAME} ${FTP_PASSWORD}
          mirror --reverse --delete --parallel=4 --exclude-glob .well-known --exclude-glob '.well-known/**' --exclude-glob cgi-bin --exclude-glob 'cgi-bin/**' dist/ /
          bye
          LFTP
      - name: Verify staging noindex and build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://staging.osameh.dev/robots.txt | grep -q 'Disallow: /'
          expected="$(jq -r '.buildId' dist/build-info.json)"
          live="$(curl -fsS -H 'Cache-Control: no-cache' "https://staging.osameh.dev/build-info.json?ci=${GITHUB_SHA}" | jq -r '.buildId')"
          [[ "$live" == "$expected" ]]
