name: Staging pipeline

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: osameh-dev-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate for staging
    uses: ./.github/workflows/quality.yml
    with:
      deploy_env: staging
      artifact_name: osameh-staging-dist

  deploy:
    name: Deploy tested bundle → staging.osameh.dev
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.osameh.dev
    steps:
      - name: Download tested staging bundle
        uses: actions/download-artifact@v8
        with:
          name: osameh-staging-dist
          path: dist

      - name: Validate staging bundle
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in index.html .htaccess build-info.json robots.txt; do
            if [[ ! -f "dist/$file" ]]; then
              echo "::error::Downloaded staging artifact is missing dist/$file"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1
          grep -q 'Disallow: /' dist/robots.txt
          jq . dist/build-info.json

      - name: Install deployment client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify staging FTPS certificate fingerprint
        shell: bash
        env:
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          STAGING_FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          STAGING_FTP_CERT_FINGERPRINT: ${{ secrets.STAGING_FTP_CERT_FINGERPRINT }}
        run: |
          set -euo pipefail
          : "${STAGING_FTP_HOST:?Missing STAGING_FTP_HOST}"
          : "${STAGING_FTP_CERT_FINGERPRINT:?Missing STAGING_FTP_CERT_FINGERPRINT}"
          STAGING_FTP_PORT="${STAGING_FTP_PORT:-21}"
          cert_file="$(mktemp)"; trap 'rm -f "$cert_file"' EXIT
          timeout 25 openssl s_client -connect "${STAGING_FTP_HOST}:${STAGING_FTP_PORT}" -starttls ftp -showcerts </dev/null 2>/dev/null \
            | awk '/-----BEGIN CERTIFICATE-----/{flag=1} flag{print} /-----END CERTIFICATE-----/{exit}' > "$cert_file"
          test -s "$cert_file" || { echo "::error::Could not read staging FTPS certificate"; exit 1; }
          sha256="$(openssl x509 -in "$cert_file" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          sha1="$(openssl x509 -in "$cert_file" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$STAGING_FTP_CERT_FINGERPRINT" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ${#expected} -eq 64 ]]; then actual="$sha256"; elif [[ ${#expected} -eq 40 ]]; then actual="$sha1"; else echo "::error::Invalid staging fingerprint length"; exit 1; fi
          [[ "$expected" == "$actual" ]] || { echo "::error::Staging FTPS fingerprint mismatch"; exit 1; }

      - name: Preflight staging FTPS login
        shell: bash
        env:
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          STAGING_FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STAGING_FTP_HOST:?Missing STAGING_FTP_HOST}"
          : "${STAGING_FTP_USERNAME:?Missing STAGING_FTP_USERNAME}"
          : "${LFTP_PASSWORD:?Missing STAGING_FTP_PASSWORD}"
          STAGING_FTP_PORT="${STAGING_FTP_PORT:-21}"
          if ! lftp --norc --env-password --user "${STAGING_FTP_USERNAME}" -p "${STAGING_FTP_PORT}" "${STAGING_FTP_HOST}" <<'LFTP'
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          cls -1 /
          bye
          LFTP
          then
            echo "::error::Staging FTPS login failed. Verify only STAGING_FTP_HOST, STAGING_FTP_PORT, STAGING_FTP_USERNAME and STAGING_FTP_PASSWORD. Production FTP secrets are never used by this job."
            exit 1
          fi

      - name: Deploy staging with staging-only credentials
        shell: bash
        env:
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          STAGING_FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          STAGING_FTP_PORT="${STAGING_FTP_PORT:-21}"
          lftp --norc --env-password --user "${STAGING_FTP_USERNAME}" -p "${STAGING_FTP_PORT}" "${STAGING_FTP_HOST}" <<'LFTP'
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set net:reconnect-interval-base 5
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          mirror --reverse --delete --verbose --parallel=4 --no-perms \
            --exclude-glob .well-known \
            --exclude-glob '.well-known/**' \
            --exclude-glob cgi-bin \
            --exclude-glob 'cgi-bin/**' \
            dist/ /
          bye
          LFTP

      # Root returning 200 is not acceptance. Contact fails closed without
      # verification, so a deploy that cannot load its environment-local
      # configuration must fail here rather than sit quietly degraded.
      - name: Verify staging service readiness
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS -H 'Cache-Control: no-cache' "https://staging.osameh.dev/api/health?ci=${GITHUB_SHA}")"
          environment="$(jq -r '.environment // .build.environment // empty' <<<"$health")"
          recaptcha="$(jq -r '.services.recaptcha.configured // false' <<<"$health")"
          contact="$(jq -r '.services.contact.status // empty' <<<"$health")"
          echo "environment=$environment recaptcha_configured=$recaptcha contact=$contact"
          [[ "$environment" == "staging" ]] || { echo "::error::staging reported environment $environment"; exit 1; }
          [[ "$recaptcha" == "true" ]] || { echo "::error::Contact protection is not configured on staging"; exit 1; }
          [[ "$contact" == "operational" ]] || { echo "::error::Contact is $contact on staging"; exit 1; }


      # Live acceptance for the branded error experience. Two different
      # contracts, proved on the deployed environment because neither is
      # observable from a static preview:
      #
      #   a forbidden DOCUMENT  -> 403 + the branded Vanta error workspace
      #   a forbidden /api/ URL -> 403 + JSON
      #
      # The document surface is a real, permanent asset directory with no index,
      # refused by "Options -Indexes". Nothing is created to be forbidden, and
      # no public debug or crash endpoint exists.
      - name: Verify branded document errors and the API error contract
        shell: bash
        env:
          BASE_URL: https://staging.osameh.dev
        run: |
          set -euo pipefail
          body="$(mktemp)"; trap 'rm -f "$body"' EXIT

          # No -f (it would discard the error body) and no -L (a branded error
          # must never be reached through a redirect).
          read -r status type redirects < <(curl -sS -o "$body" \
            -w '%{http_code} %{content_type} %{num_redirects}\n' \
            -H 'Cache-Control: no-cache' "${BASE_URL}/icons/?ci=${GITHUB_SHA}")
          echo "document 403 probe: status=$status content_type=$type redirects=$redirects"

          [[ "$status" == "403" ]] || { echo "::error::Forbidden document answered $status, expected 403"; exit 1; }
          [[ "$redirects" == "0" ]] || { echo "::error::Forbidden document was redirected $redirects time(s); the status must survive"; exit 1; }
          grep -qi '^text/html' <<<"$type" || { echo "::error::Forbidden document Content-Type is $type, expected text/html"; exit 1; }
          grep -q 'error_403.cpp' "$body" || { echo "::error::Forbidden document is not the branded error workspace"; exit 1; }
          grep -q 'Forbidden' "$body" || { echo "::error::Forbidden document does not state its reason"; exit 1; }

          # The hosting provider's template, a directory listing, and anything
          # that would describe the server or the rule behind the refusal.
          for leak in 'Index of' 'DirectAdmin' 'cPanel' 'Apache/' 'Server at' 'Fatal error' 'Warning:' '/home/' '.php'; do
            if grep -qF "$leak" "$body"; then echo "::error::Forbidden document leaks or carries foreign branding: $leak"; exit 1; fi
          done

          # The API keeps its own contract. A branded HTML page here would be a
          # regression in the opposite direction.
          read -r api_status api_type < <(curl -sS -o "$body" \
            -w '%{http_code} %{content_type}\n' \
            -H 'Cache-Control: no-cache' "${BASE_URL}/api/recaptcha.php?ci=${GITHUB_SHA}")
          echo "api 403 probe: status=$api_status content_type=$api_type"

          [[ "$api_status" == "403" ]] || { echo "::error::Forbidden API path answered $api_status, expected 403"; exit 1; }
          grep -qi '^application/json' <<<"$api_type" || { echo "::error::Forbidden API Content-Type is $api_type, expected application/json"; exit 1; }
          jq -e '.error == "Forbidden"' "$body" >/dev/null || { echo "::error::Forbidden API response is not the documented JSON refusal"; exit 1; }
          if grep -qiE '<html|error_403\.cpp' "$body"; then echo "::error::An API response was replaced by a branded HTML error document"; exit 1; fi

          # The ErrorDocument target must be present and reachable in its own
          # right; that direct 200 is what makes the internal subrequest work.
          test -f dist/errors/403.html || { echo "::error::The deployed artifact is missing errors/403.html"; exit 1; }
          target="$(curl -sS -o /dev/null -w '%{http_code}' "${BASE_URL}/errors/403.html?ci=${GITHUB_SHA}")"
          [[ "$target" == "200" ]] || { echo "::error::/errors/403.html answered $target, expected 200"; exit 1; }

      - name: Verify staging noindex and build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://staging.osameh.dev/robots.txt | grep -q 'Disallow: /'
          expected="$(jq -r '.buildId' dist/build-info.json)"
          matched=0
          for attempt in {1..8}; do
            live="$(curl -fsS -H 'Cache-Control: no-cache' "https://staging.osameh.dev/build-info.json?ci=${GITHUB_SHA}-${attempt}" | jq -r '.buildId // empty' 2>/dev/null || true)"
            [[ "$live" == "$expected" ]] && { matched=1; break; }
            sleep 8
          done
          [[ "$matched" -eq 1 ]] || { echo "::error::Staging build verification failed"; exit 1; }
