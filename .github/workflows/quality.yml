name: Quality gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static checks → build → browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Repository quality gates
        run: npm run quality
      - name: TypeScript
        run: npm run typecheck
      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find public -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Production build
        run: npm run build
      - name: Verify deployment bundle and local links
        run: npm run verify:dist
      - name: Install Playwright test runner without changing lockfile
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E and accessibility smoke
        run: npx playwright test
      - name: Lighthouse quality report
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --quiet --chrome-flags='--headless --no-sandbox' \
            --only-categories=accessibility,best-practices,seo \
            --output=json --output-path=/tmp/lighthouse.json
          node - <<'NODE'
          const r=require('/tmp/lighthouse.json');
          const min={accessibility:.9,'best-practices':.9,seo:.9};
          for(const [k,v] of Object.entries(min)){
            const score=r.categories[k].score;
            console.log(`${k}: ${Math.round(score*100)}`);
            if(score<v) process.exitCode=1;
          }
          NODE
