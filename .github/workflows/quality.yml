name: Quality gates

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      build_mode:
        description: Bundle mode to validate (production or staging)
        required: false
        type: string
        default: production
      artifact_name:
        description: Optional name for the tested dist artifact
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Static checks → build → E2E → Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          playwright_version="$(node -p "require('./package.json').devDependencies['@playwright/test'] || ''")"
          lock_playwright_version=""
          if [[ -f package-lock.json ]]; then
            lock_playwright_version="$(node -e "const l=require('./package-lock.json'); process.stdout.write(l.packages?.['node_modules/@playwright/test']?.version || '')")"
          fi

          if [[ -f package-lock.json && -n "$playwright_version" && "$lock_playwright_version" == "$playwright_version" ]]; then
            npm ci --include=dev --no-audit --no-fund
          else
            if [[ -f package-lock.json ]]; then
              echo "::warning::package-lock.json does not contain @playwright/test ${playwright_version}; using npm install so CI can reconcile the stale lockfile. Commit the regenerated lockfile after the next local install."
            else
              echo "::warning::package-lock.json is missing; using npm install. Commit the lockfile for reproducible CI."
            fi
            npm install --include=dev --no-audit --no-fund
          fi

          npm ls --depth=0 "@playwright/test@${playwright_version}"

      - name: Repository quality gates
        run: npm run quality

      - name: TypeScript
        run: npm run typecheck

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build tested bundle
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'production' }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" == "staging" ]]; then
            npm run build:staging
          elif [[ "$BUILD_MODE" == "production" ]]; then
            npm run build
          else
            echo "::error::Unsupported build_mode: $BUILD_MODE"
            exit 1
          fi

      - name: Verify deployment bundle and local links
        run: npm run verify:dist

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Browser E2E and accessibility smoke
        run: npm run test:e2e

      - name: Lighthouse quality report
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Vite preview exited before Lighthouse could start."
              cat /tmp/portfolio-preview.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Vite preview did not become ready on 127.0.0.1:4173."
            cat /tmp/portfolio-preview.log
            exit 1
          fi
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --quiet --chrome-flags='--headless --no-sandbox' \
            --only-categories=accessibility,best-practices,seo \
            --output=json --output-path=/tmp/lighthouse.json
          node - <<'NODE'
          const r=require('/tmp/lighthouse.json');
          const min={accessibility:.9,'best-practices':.9,seo:.9};
          for(const [k,v] of Object.entries(min)){
            const score=r.categories[k].score;
            console.log(`${k}: ${Math.round(score*100)}`);
            if(score<v) process.exitCode=1;
          }
          NODE

      - name: Upload tested deployment bundle
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
