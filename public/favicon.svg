    </linearGradient>
    <linearGradient id="limeTop" x1="16" y1="6" x2="24" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CAFF5A"/>
      <stop offset="1" stop-color="#A8F23B"/>
    </linearGradient>
    <linearGradient id="limeBottom" x1="24" y1="17" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CAFF5A"/>
